name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag is not a semantic version: $TAG" >&2
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SOURCE_DATE_EPOCH:=0}"
          if ! [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]; then
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")"
          fi

          dist="dist/${GOOS}_${GOARCH}"
          mkdir -p "$dist"
          binary="figma"
          archive="figma_${TAG#v}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            binary="figma.exe"
            archive="${archive}.zip"
          else
            archive="${archive}.tar.gz"
          fi

          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -buildvcs=false -o "$dist/$binary" ./cmd/figma
          touch -d "@$SOURCE_DATE_EPOCH" "$dist/$binary"

          mkdir -p artifacts
          if [[ "$GOOS" == "windows" ]]; then
            (cd "$dist" && zip -X -q "../../artifacts/$archive" "$binary")
          else
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
              -C "$dist" -czf "artifacts/$archive" "$binary"
          fi

      - name: Upload archive for publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Validate archives and create checksums
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag is not a semantic version: $TAG" >&2
            exit 1
          }
          mapfile -t archives < <(find artifacts -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort)
          [[ "${#archives[@]}" -eq 6 ]] || {
            echo "Expected six archives, found ${#archives[@]}" >&2
            exit 1
          }
          for archive in "${archives[@]}"; do
            [[ "$archive" == figma_*_*_*.* ]] || {
              echo "Unexpected archive name: $archive" >&2
              exit 1
            }
          done
          (cd artifacts && sha256sum "${archives[@]}" > SHA256SUMS)
          test "$(wc -l < artifacts/SHA256SUMS)" -eq 6

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --verify-tag --title "$TAG" --generate-notes
          fi
