name: Live Figma smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    # workflow_dispatch runs only from this repository; never attach this workflow to PR events.
    runs-on: ubuntu-latest
    environment: figma-live-smoke
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: jqlang/jq-action@v1
      - name: Build Figma CLI
        run: go build -o figma ./cmd/figma
      - name: Run read-only live smoke
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_SMOKE_FILE_URL: ${{ vars.FIGMA_SMOKE_FILE_URL }}
          FIGMA_SMOKE_NODE_URL: ${{ vars.FIGMA_SMOKE_NODE_URL }}
          FIGMA_SMOKE_FIND_NAME: ${{ vars.FIGMA_SMOKE_FIND_NAME }}
          FIGMA_SMOKE_TEAM_ID: ${{ vars.FIGMA_SMOKE_TEAM_ID }}
          FIGMA_SMOKE_PROJECT_ID: ${{ vars.FIGMA_SMOKE_PROJECT_ID }}
          FIGMA_BIN: ./figma
        run: scripts/live-smoke.sh
