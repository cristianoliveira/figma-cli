# Configuration for oapi-codegen type generation from the Figma REST API spec.
# The spec is OpenAPI 3.1 which needs down-conversion to 3.0 before generation.
# See scripts/generate-api-types.sh for the full pipeline.
package: api
output: internal/figma/api/api.gen.go
generate:
  models: true
  client: false
output-options:
  skip-prune: true
